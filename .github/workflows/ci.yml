name: StudyBud CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Django CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  frontend:
    name: React CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637417025050:role/StudyBudGitHubActionsRole
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t studybud-web .
          docker tag studybud-web:latest \
            637417025050.dkr.ecr.ap-southeast-2.amazonaws.com/studybud-web:latest
          docker push \
            637417025050.dkr.ecr.ap-southeast-2.amazonaws.com/studybud-web:latest

      - name: Build and push frontend image
        run: |
          docker build -t studybud-frontend ./frontend
          docker tag studybud-frontend:latest \
            637417025050.dkr.ecr.ap-southeast-2.amazonaws.com/studybud-frontend:latest
          docker push \
            637417025050.dkr.ecr.ap-southeast-2.amazonaws.com/studybud-frontend:latest

